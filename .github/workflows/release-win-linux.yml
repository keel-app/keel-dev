# Public CI repo (sanhpotter/Keel) — no application source here.
# Clones private source at release time, builds Win/Linux, uploads to RELEASE_REPO.
#
# Secrets: SOURCE_REPO, RELEASE_REPO, SOURCE_REPO_PAT, RELEASE_REPO_PAT,
#          TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional)

name: Release Windows + Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.2.0 or 0.2.0)"
        required: true
        type: string
  repository_dispatch:
    types: [release]

concurrency:
  group: release-${{ github.event.client_payload.version || github.event.inputs.version }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  RELEASE_REPO: ${{ secrets.RELEASE_REPO }}

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Auth gh (releases repo)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
        run: echo "$GH_TOKEN" | gh auth login --with-token

      - name: Verify macOS release exists
        shell: bash
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ env.RELEASE_REPO }}" \
            || { echo "::error::Release ${{ steps.ver.outputs.tag }} not found on ${{ env.RELEASE_REPO }}. Run macOS publish first."; exit 1; }

      - name: Checkout source (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ steps.ver.outputs.tag }}
          path: source

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Publish Windows (--no-bump)
        working-directory: source
        shell: bash
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
        run: bash scripts/publish-github-release-windows.sh "${{ steps.ver.outputs.version }}" --no-bump

  release-linux:
    runs-on: ubuntu-latest
    needs: release-windows
    timeout-minutes: 120
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Auth gh (releases repo)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
        run: echo "$GH_TOKEN" | gh auth login --with-token

      - name: Checkout source (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ steps.ver.outputs.tag }}
          path: source

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Publish Linux (--no-bump)
        working-directory: source
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
        run: bash scripts/publish-github-release-linux.sh "${{ steps.ver.outputs.version }}" --no-bump
