# Public CI repo (sanhpotter/Keel) — no application source here.
# Clones private source at release time, builds Win/Linux, uploads to RELEASE_REPO.
#
# Secrets: SOURCE_REPO, RELEASE_REPO, SOURCE_REPO_PAT, RELEASE_REPO_PAT,
#          TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optional)

name: Release Windows + Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.2.0 or 0.2.0)"
        required: true
        type: string
  repository_dispatch:
    types: [release]

concurrency:
  group: release-${{ github.event.client_payload.version || github.event.inputs.version }}
  cancel-in-progress: false

env:
  SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
  RELEASE_REPO: ${{ secrets.RELEASE_REPO }}
  # gh CLI uses GH_TOKEN directly — do not run `gh auth login` when this is set.
  GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        shell: bash
        run: |
          missing=0
          [[ -z "${{ secrets.RELEASE_REPO_PAT }}" ]] && { echo "::error::Missing RELEASE_REPO_PAT"; missing=1; }
          [[ -z "${{ secrets.SOURCE_REPO_PAT }}" ]] && { echo "::error::Missing SOURCE_REPO_PAT"; missing=1; }
          [[ -z "${{ env.SOURCE_REPO }}" ]] && { echo "::error::Missing SOURCE_REPO secret"; missing=1; }
          [[ -z "${{ env.RELEASE_REPO }}" ]] && { echo "::error::Missing RELEASE_REPO secret"; missing=1; }
          exit "$missing"

      - name: Verify macOS release exists
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          REPO="${{ env.RELEASE_REPO }}"
          echo "Looking for release $TAG on $REPO ..."
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Found release $TAG"
            exit 0
          fi
          echo "::error title=macOS release missing::No GitHub release $TAG on $REPO."
          echo "1) On your Mac, from the private source repo:"
          echo "   RELEASE_REPO=$REPO pnpm publish:release ${TAG#v}"
          echo "2) Confirm RELEASE_REPO secret on this repo matches where you upload (same as above)."
          echo "3) Re-run this workflow (or push tag on source to dispatch again)."
          echo ""
          echo "Recent releases on $REPO (if token can read):"
          gh release list --repo "$REPO" --limit 5 || echo "(could not list releases — check RELEASE_REPO_PAT Contents read on $REPO)"
          exit 1

      - name: Checkout source (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ steps.ver.outputs.tag }}
          path: source

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install frontend deps
        shell: bash
        working-directory: source
        run: |
          test -f package.json || { echo "::error::No package.json in source/ — check SOURCE_REPO_PAT and tag ref"; exit 1; }
          pnpm install --frozen-lockfile

      - name: Publish Windows x64 (--no-bump)
        working-directory: source
        shell: bash
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/publish-github-release-windows.sh "${{ steps.ver.outputs.version }}" --no-bump

      - name: Publish Windows ARM64 (--no-bump)
        working-directory: source
        shell: bash
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          WINDOWS_BUILD_TARGET: aarch64-pc-windows-msvc
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/publish-github-release-windows.sh "${{ steps.ver.outputs.version }}" --no-bump

  release-linux:
    runs-on: ubuntu-latest
    needs: release-windows
    timeout-minutes: 120
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        run: |
          missing=0
          [[ -z "${{ secrets.RELEASE_REPO_PAT }}" ]] && { echo "::error::Missing RELEASE_REPO_PAT"; missing=1; }
          [[ -z "${{ secrets.SOURCE_REPO_PAT }}" ]] && { echo "::error::Missing SOURCE_REPO_PAT"; missing=1; }
          [[ -z "${{ env.SOURCE_REPO }}" ]] && { echo "::error::Missing SOURCE_REPO secret"; missing=1; }
          [[ -z "${{ env.RELEASE_REPO }}" ]] && { echo "::error::Missing RELEASE_REPO secret"; missing=1; }
          exit "$missing"

      - name: Checkout source (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ steps.ver.outputs.tag }}
          path: source

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        shell: bash
        working-directory: source
        run: |
          test -f package.json || { echo "::error::No package.json in source/ — check SOURCE_REPO_PAT and tag ref"; exit 1; }
          pnpm install --frozen-lockfile

      - name: Publish Linux x64 (--no-bump)
        working-directory: source
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/publish-github-release-linux.sh "${{ steps.ver.outputs.version }}" --no-bump

  release-linux-arm64:
    runs-on: ubuntu-24.04-arm
    needs: release-linux
    timeout-minutes: 120
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            V="${{ github.event.client_payload.version }}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Validate secrets
        run: |
          missing=0
          [[ -z "${{ secrets.RELEASE_REPO_PAT }}" ]] && { echo "::error::Missing RELEASE_REPO_PAT"; missing=1; }
          [[ -z "${{ secrets.SOURCE_REPO_PAT }}" ]] && { echo "::error::Missing SOURCE_REPO_PAT"; missing=1; }
          [[ -z "${{ env.SOURCE_REPO }}" ]] && { echo "::error::Missing SOURCE_REPO secret"; missing=1; }
          [[ -z "${{ env.RELEASE_REPO }}" ]] && { echo "::error::Missing RELEASE_REPO secret"; missing=1; }
          exit "$missing"

      - name: Checkout source (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          ref: ${{ steps.ver.outputs.tag }}
          path: source

      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev xdg-utils

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        shell: bash
        working-directory: source
        run: |
          test -f package.json || { echo "::error::No package.json in source/ — check SOURCE_REPO_PAT and tag ref"; exit 1; }
          pnpm install --frozen-lockfile

      - name: Publish Linux ARM64 (--no-bump)
        working-directory: source
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
          LINUX_BUILD_TARGET: aarch64-unknown-linux-gnu
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/publish-github-release-linux.sh "${{ steps.ver.outputs.version }}" --no-bump
